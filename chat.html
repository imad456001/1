<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحادثات | وان 1</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; margin: 0; background: #e5ddd5; height: 100vh; display: flex; flex-direction: column; }
        .chat-header { background: #6c5ce7; color: white; padding: 15px; display: flex; align-items: center; position: sticky; top: 0; }
        .chat-header img { width: 40px; height: 40px; border-radius: 50%; margin-left: 12px; border: 2px solid white; }
        .msg-area { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .bubble { max-width: 75%; padding: 12px; border-radius: 15px; font-size: 14px; line-height: 1.5; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .received { background: white; align-self: flex-start; border-bottom-right-radius: 2px; }
        .sent { background: #dcf8c6; align-self: flex-end; border-bottom-left-radius: 2px; }
        .chat-input-bar { background: white; padding: 12px; display: flex; align-items: center; gap: 10px; }
        .chat-input-bar input { flex: 1; border: none; padding: 12px; background: #f0f0f0; border-radius: 25px; outline: none; }
        .send-icon { color: #6c5ce7; font-size: 22px; cursor: pointer; }
    </style>
</head>
<body>

<div class="chat-header">
    <a href="index.html" style="color: white; margin-left: 10px;"><i class="fa fa-arrow-right"></i></a>
    <img src="https://i.pravatar.cc/100" alt="user">
    <div>
        <div style="font-weight: bold;">سلطان العتيبي</div>
        <div style="font-size: 11px; opacity: 0.9;">متصل الآن</div>
    </div>
</div>

<div class="msg-area">
    <div class="bubble received">السلام عليكم، هل الجهاز لسه متوفر؟</div>
    <div class="bubble sent">وعليكم السلام، نعم موجود وأخو الجديد.</div>
    <div class="bubble received">كم حدك من الآخر للصامل؟</div>
</div>

<div class="chat-input-bar">
    <i class="fa fa-plus" style="color: #666;"></i>
    <input type="text" placeholder="اكتب رسالتك...">
    <i class="fa fa-camera" style="color: #666;"></i>
    <i class="fa fa-paper-plane send-icon"></i>
</div>

</body>
</html>
