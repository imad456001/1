<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أضف إعلانك | وان 1</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background: #f4f4f9; margin: 0; padding: 20px; }
        .form-container { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); max-width: 600px; margin: auto; }
        h2 { color: #6c5ce7; text-align: center; margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; outline: none; }
        input:focus { border-color: #6c5ce7; }
        .upload-box { border: 2px dashed #6c5ce7; padding: 30px; text-align: center; border-radius: 15px; color: #6c5ce7; cursor: pointer; background: #f9f8ff; margin-bottom: 20px; }
        .submit-btn { background: #6c5ce7; color: white; width: 100%; padding: 15px; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .submit-btn:hover { background: #000; }
        .back-btn { display: inline-block; margin-bottom: 15px; text-decoration: none; color: #888; }
    </style>
</head>
<body>

<div class="form-container">
    <a href="index.html" class="back-btn"><i class="fa fa-arrow-right"></i> رجوع</a>
    <h2>إضافة إعلان جديد 🚀</h2>
    
    <div class="upload-box">
        <i class="fa fa-cloud-upload-alt fa-3x"></i>
        <p>اضغط لرفع صور المنتج (حد أقصى 5 صور)</p>
    </div>

    <div class="input-group">
        <label>عنوان الإعلان</label>
        <input type="text" placeholder="مثلاً: آيفون 15 برو ماكس 256 جيجا">
    </div>

    <div class="input-group">
        <label>القسم</label>
        <select>
            <option>سيارات</option>
            <option>إلكترونيات</option>
            <option>ملابس</option>
            <option>خدمات</option>
        </select>
    </div>

    <div class="input-group">
        <label>السعر (ريال)</label>
        <input type="number" placeholder="0.00">
    </div>

    <div class="input-group">
        <label>وصف الإعلان</label>
        <textarea rows="4" placeholder="اكتب تفاصيل المنتج، حالته، وسبب البيع..."></textarea>
    </div>

    <button class="submit-btn">نشر الإعلان الآن</button>
</div>

</body>
</html>
